<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>정상어학원 이달의 소식지</title>
    <style>
        body {
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent; 
        }
        .container {
            width: 100%;
            max-width: 900px;
            height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .flip-book {
            box-shadow: 0 12px 24px rgba(0,0,0,0.15);
            background-color: #fff;
        }
        .page {
            padding: 0;
            background-color: #fdfdfd;
            overflow: hidden;
        }
        /* 확대 기능을 위해 page-content 구조 개선 */
        .page-content {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }
        .pinch-zoom-container {
            width: 100%;
            height: 100%;
        }
        .page-content img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            transform: translate3d(0, 0, 0);
            will-change: transform;
        }
    </style>
</head>
<body>

<!-- 이미지 사전 로딩 -->
<div style="width: 0; height: 0; overflow: hidden; visibility: hidden; display: none;">
    <img src="page1.jpg"><img src="page2.jpg"><img src="page3.jpg"><img src="page4.jpg"><img src="page5.jpg">
    <img src="page6.jpg"><img src="page7.jpg"><img src="page8.jpg"><img src="page9.jpg"><img src="page10.jpg">
</div>

<div class="container">
    <div class="flip-book" id="book">
        <!-- 각 페이지마다 pinch-zoom 클래스를 부여하여 개별 확대가 가능하게 합니다 -->
        <div class="page"><div class="page-content"><div class="pinch-zoom"><img src="page1.jpg" alt="1페이지"></div></div></div>
        <div class="page"><div class="page-content"><div class="pinch-zoom"><img src="page2.jpg" alt="2페이지"></div></div></div>
        <div class="page"><div class="page-content"><div class="pinch-zoom"><img src="page3.jpg" alt="3페이지"></div></div></div>
        <div class="page"><div class="page-content"><div class="pinch-zoom"><img src="page4.jpg" alt="4페이지"></div></div></div>
        <div class="page"><div class="page-content"><div class="pinch-zoom"><img src="page5.jpg" alt="5페이지"></div></div></div>
        <div class="page"><div class="page-content"><div class="pinch-zoom"><img src="page6.jpg" alt="6페이지"></div></div></div>
        <div class="page"><div class="page-content"><div class="pinch-zoom"><img src="page7.jpg" alt="7페이지"></div></div></div>
        <div class="page"><div class="page-content"><div class="pinch-zoom"><img src="page8.jpg" alt="8페이지"></div></div></div>
        <div class="page"><div class="page-content"><div class="pinch-zoom"><img src="page9.jpg" alt="9페이지"></div></div></div>
        <div class="page"><div class="page-content"><div class="pinch-zoom"><img src="page10.jpg" alt="10페이지"></div></div></div>
    </div>
</div>

<!-- 플립북 라이브러리 및 확대 라이브러리 로드 -->
<script src="https://cdn.jsdelivr.net/npm/page-flip@0.4.3/dist/js/page-flip.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pinch-zoom-js@2.3.4/dist/pinch-zoom.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        // 1. 플립북 초기화
        const pageFlip = new St.PageFlip(document.getElementById("book"), {
            width: 400, 
            height: 560,
            size: "stretch",
            minWidth: 300,
            maxWidth: 1000,
            minHeight: 420,
            maxHeight: 1350,
            maxShadowOpacity: 0.3,
            showCover: true,
            mobileScrollSupport: false
        });

        pageFlip.loadFromHTML(document.querySelectorAll(".page"));

        // 2. 모든 페이지에 손가락 확대(Pinch Zoom) 기능 바인딩
        const el = document.querySelectorAll('.pinch-zoom');
        el.forEach(function(element) {
            new PinchZoom(element, {
                draggableUnzoomed: false, // 평소에는 드래그 차단 (페이지 넘김 방해 안 되게)
                minZoom: 1,
                maxZoom: 4 // 최대 4배까지 확대 가능
            });
        });
    });
</script>

</body>
</html>
