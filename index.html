<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>정상어학원 이달의 소식지</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <style>
        html, body {
            position: relative;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            font-family: sans-serif;
            overflow: hidden;
        }
        .swiper {
            width: 100%;
            height: 100%;
            max-width: 500px; /* PC/모바일 모두 세로형 책자 느낌을 주도록 가로폭 최적화 */
            margin: 0 auto;
        }
        .swiper-slide {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f2f5;
            /* 3D 플립 효과 시 뒷면이 비치는 현상 방지 */
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }
        .swiper-zoom-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .swiper-zoom-container img {
            max-width: 95%;
            max-height: 90vh;
            object-fit: contain;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            background: #fff;
            border-radius: 4px;
        }
        /* 이동 화살표 및 하단 페이지 표시 색상 */
        .swiper-button-next, .swiper-button-prev {
            color: #1a73e8; 
        }
        .swiper-pagination-bullet-active {
            background: #1a73e8;
        }
    </style>
</head>
<body>

<div style="width:0; height:0; overflow:hidden; visibility:hidden; display:none;">
    <img src="page1.jpg"><img src="page2.jpg"><img src="page3.jpg"><img src="page4.jpg"><img src="page5.jpg">
    <img src="page6.jpg"><img src="page7.jpg"><img src="page8.jpg"><img src="page9.jpg"><img src="page10.jpg">
</div>

<div class="swiper mySwiper">
    <div class="swiper-wrapper">
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page1.jpg" alt="1페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page2.jpg" alt="2페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page3.jpg" alt="3페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page4.jpg" alt="4페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page5.jpg" alt="5페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page6.jpg" alt="6페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page7.jpg" alt="7페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page8.jpg" alt="8페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page9.jpg" alt="9페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page10.jpg" alt="10페이지"></div></div>
    </div>
    
    <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>
    <div class="swiper-pagination"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    const swiper = new Swiper(".mySwiper", {
        // 1. 진짜 책처럼 입체적으로 뒤집히는 3D Flip 효과 강제 적용
        effect: "flip",
        flipEffect: {
            slideShadows: true, // 넘겨질 때 책 안쪽에 입체적인 그림자 생성
            limitRotation: true,
        },
        // 2. 완벽한 손가락 확대 및 더블 터치 확대 기능 결합
        zoom: {
            maxRatio: 3, // 최대 3배 확대
            toggle: true, // 더블 터치 시 확대/축소 토글
        },
        speed: 600, // 책장 넘어가는 속도 (ms)
        grabCursor: true,
        keyboard: true,
        navigation: {
            nextEl: ".swiper-button-next",
            prevEl: ".swiper-button-prev",
        },
        pagination: {
            el: ".swiper-pagination",
            clickable: true,
        },
    });
</script>

</body>
</html>
