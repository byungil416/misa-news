<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <!-- 모바일 확대 허용 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Newsletter Slide Viewer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #222;
      color: #fff;
      overflow: hidden;
    }

    .viewer {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle, #444 0%, #1c1c1c 70%);
    }

    .topbar {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: rgba(0, 0, 0, 0.55);
      z-index: 10;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
    }

    .buttons {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button {
      border: 0;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .slide-area {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: manipulation;
    }

    .slide-box {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s ease;
    }

    .slide-img {
      max-width: 92vw;
      max-height: calc(100vh - 165px);
      object-fit: contain;
      background: #fff;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.55);
      border-radius: 8px;
      transition: opacity 0.25s ease, transform 0.25s ease;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    .slide-img.fade {
      opacity: 0;
      transform: scale(0.98);
    }

    .nav-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 25%;
      cursor: pointer;
      z-index: 5;
    }

    .nav-left {
      left: 0;
    }

    .nav-right {
      right: 0;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 64px;
      opacity: 0;
      transition: opacity 0.2s ease;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
      pointer-events: none;
    }

    .nav-left .arrow {
      left: 28px;
    }

    .nav-right .arrow {
      right: 28px;
    }

    .nav-zone:hover .arrow {
      opacity: 0.75;
    }

    .bottom-bar {
      min-height: 108px;
      height: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px 20px;
      padding-bottom: calc(14px + env(safe-area-inset-bottom));
      background: rgba(0, 0, 0, 0.55);
      z-index: 10;
      flex-shrink: 0;
    }

    .bottom-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding-top: 4px;
    }

    .page-info {
      min-width: 90px;
      text-align: center;
      font-size: 14px;
    }

    input[type="range"] {
      width: min(50vw, 520px);
      accent-color: white;
    }

    .dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      min-height: 16px;
      flex-wrap: wrap;
      max-width: min(52vw, 520px);
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
      flex: 0 0 auto;
    }

    .dot.active {
      background: #fff;
      transform: scale(1.35);
    }

    .dot:hover {
      background: rgba(255, 255, 255, 0.75);
    }

    .thumbs {
      position: absolute;
      left: 50%;
      bottom: 120px;
      transform: translateX(-50%);
      width: min(92vw, 900px);
      display: none;
      gap: 8px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 14px;
      overflow-x: auto;
      z-index: 20;
    }

    .thumbs.show {
      display: flex;
    }

    .thumb {
      width: 70px;
      height: 95px;
      flex: 0 0 auto;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      background: #fff;
    }

    .thumb.active {
      border-color: #fff;
      transform: translateY(-3px);
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @media (max-width: 700px) {
      .topbar {
        height: 52px;
        padding: 0 10px;
      }

      .title {
        font-size: 13px;
      }

      button {
        padding: 7px 9px;
        font-size: 12px;
      }

      .bottom-bar {
        min-height: 112px;
        gap: 8px;
        padding: 10px;
        padding-bottom: calc(18px + env(safe-area-inset-bottom));
        align-items: center;
      }

      .bottom-center {
        gap: 9px;
        padding-top: 2px;
      }

      input[type="range"] {
        width: 40vw;
      }

      .dots {
        gap: 6px;
        min-height: 18px;
        max-width: 42vw;
      }

      .dot {
        width: 8px;
        height: 8px;
      }

      .page-info {
        min-width: 62px;
        font-size: 12px;
      }

      .slide-img {
        max-width: 94vw;
        max-height: calc(100vh - 170px);
      }

      .arrow {
        font-size: 46px;
      }

      .thumbs {
        bottom: 122px;
      }
    }

    @media (max-width: 430px) {
      .bottom-bar {
        min-height: 118px;
        gap: 6px;
        padding-left: 8px;
        padding-right: 8px;
        padding-bottom: calc(20px + env(safe-area-inset-bottom));
      }

      button {
        padding: 7px 8px;
        font-size: 12px;
      }

      input[type="range"] {
        width: 36vw;
      }

      .dots {
        max-width: 40vw;
        gap: 5px;
      }

      .dot {
        width: 7px;
        height: 7px;
      }

      .page-info {
        min-width: 54px;
        font-size: 12px;
      }

      .slide-img {
        max-height: calc(100vh - 178px);
      }

      .thumbs {
        bottom: 128px;
      }
    }
  </style>
</head>

<body>
  <div class="viewer">
    <div class="topbar">
      <div class="title">Newsletter</div>

      <div class="buttons">
        <button onclick="toggleThumbs()">목록</button>
        <button onclick="zoomOut()">－</button>
        <button onclick="zoomIn()">＋</button>
        <button onclick="toggleFullscreen()">전체화면</button>
      </div>
    </div>

    <div class="slide-area" id="slideArea">
      <div class="nav-zone nav-left" onclick="safePrevSlide(event)">
        <div class="arrow">‹</div>
      </div>

      <div class="slide-box" id="slideBox">
        <img id="slideImg" class="slide-img" src="page1.jpg" alt="newsletter page">
      </div>

      <div class="nav-zone nav-right" onclick="safeNextSlide(event)">
        <div class="arrow">›</div>
      </div>

      <div class="thumbs" id="thumbs"></div>
    </div>

    <div class="bottom-bar">
      <button id="prevBtn" onclick="prevSlide()">이전</button>

      <div class="bottom-center">
        <input type="range" id="pageSlider" min="1" max="10" value="1">
        <div class="dots" id="dots"></div>
      </div>

      <div class="page-info" id="pageInfo">1 / 10</div>
      <button id="nextBtn" onclick="nextSlide()">다음</button>
    </div>
  </div>

  <script>
    const totalPages = 10;

    // 이미지가 png라면 "jpg"를 "png"로 바꾸세요.
    const imageExtension = "jpg";

    let currentPage = 1;
    let zoom = 1;

    const slideArea = document.getElementById("slideArea");
    const slideImg = document.getElementById("slideImg");
    const slideBox = document.getElementById("slideBox");
    const pageInfo = document.getElementById("pageInfo");
    const slider = document.getElementById("pageSlider");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const thumbs = document.getElementById("thumbs");
    const dots = document.getElementById("dots");

    function imagePath(pageNumber) {
      return `page${pageNumber}.${imageExtension}`;
    }

    function renderSlide() {
      slideImg.classList.add("fade");

      setTimeout(() => {
        slideImg.src = imagePath(currentPage);
        pageInfo.textContent = `${currentPage} / ${totalPages}`;
        slider.value = currentPage;

        prevBtn.disabled = currentPage === 1;
        nextBtn.disabled = currentPage === totalPages;

        updateActiveThumb();
        updateActiveDot();

        slideImg.classList.remove("fade");
      }, 150);
    }

    function nextSlide() {
      if (currentPage < totalPages) {
        currentPage++;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentPage > 1) {
        currentPage--;
        renderSlide();
      }
    }

    function goToPage(pageNumber) {
      if (pageNumber < 1 || pageNumber > totalPages) return;

      currentPage = pageNumber;
      renderSlide();
    }

    function isZoomedIn() {
      if (zoom > 1.01) return true;

      if (window.visualViewport && window.visualViewport.scale > 1.01) {
        return true;
      }

      return false;
    }

    let blockClickUntil = 0;

    function isClickBlocked() {
      return Date.now() < blockClickUntil;
    }

    function blockClickTemporarily() {
      blockClickUntil = Date.now() + 500;
    }

    function safeNextSlide(e) {
      if (isClickBlocked()) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        return;
      }

      nextSlide();
    }

    function safePrevSlide(e) {
      if (isClickBlocked()) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        return;
      }

      prevSlide();
    }

    document.addEventListener("click", function (e) {
      if (isClickBlocked()) {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
      }
    }, true);

    slider.addEventListener("input", function () {
      currentPage = Number(this.value);
      renderSlide();
    });

    function zoomIn() {
      zoom = Math.min(zoom + 0.15, 2);
      applyZoom();
    }

    function zoomOut() {
      zoom = Math.max(zoom - 0.15, 0.7);
      applyZoom();
    }

    function applyZoom() {
      slideBox.style.transform = `scale(${zoom})`;
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    function toggleThumbs() {
      thumbs.classList.toggle("show");
    }

    function createThumbs() {
      thumbs.innerHTML = "";

      for (let i = 1; i <= totalPages; i++) {
        const thumb = document.createElement("div");
        thumb.className = "thumb";
        thumb.dataset.page = i;

        const img = document.createElement("img");
        img.src = imagePath(i);
        img.alt = `page ${i}`;

        thumb.appendChild(img);

        thumb.addEventListener("click", () => {
          if (isClickBlocked()) return;

          goToPage(i);
          thumbs.classList.remove("show");
        });

        thumbs.appendChild(thumb);
      }
    }

    function updateActiveThumb() {
      document.querySelectorAll(".thumb").forEach(thumb => {
        const page = Number(thumb.dataset.page);
        thumb.classList.toggle("active", page === currentPage);
      });
    }

    function createDots() {
      dots.innerHTML = "";

      for (let i = 1; i <= totalPages; i++) {
        const dot = document.createElement("div");
        dot.className = "dot";
        dot.dataset.page = i;
        dot.title = `${i}페이지`;

        dot.addEventListener("click", () => {
          if (isClickBlocked()) return;

          goToPage(i);
        });

        dots.appendChild(dot);
      }
    }

    function updateActiveDot() {
      document.querySelectorAll(".dot").forEach(dot => {
        const page = Number(dot.dataset.page);
        dot.classList.toggle("active", page === currentPage);
      });
    }

    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight") nextSlide();
      if (e.key === "ArrowLeft") prevSlide();
      if (e.key === "+") zoomIn();
      if (e.key === "-") zoomOut();
      if (e.key === "Escape") thumbs.classList.remove("show");
    });

    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;

    let isTouching = false;
    let isPinching = false;

    slideArea.addEventListener("touchstart", function (e) {
      isTouching = true;

      if (e.touches.length >= 2) {
        isPinching = true;
        blockClickTemporarily();
        return;
      }

      isPinching = false;
      touchStartX = e.touches[0].screenX;
      touchStartY = e.touches[0].screenY;
      touchStartTime = Date.now();
    }, { passive: true });

    slideArea.addEventListener("touchmove", function (e) {
      if (e.touches.length >= 2) {
        isPinching = true;
        blockClickTemporarily();
        return;
      }
    }, { passive: true });

    slideArea.addEventListener("touchend", function (e) {
      if (!isTouching) return;

      if (!e.changedTouches || e.changedTouches.length === 0) {
        isTouching = false;
        return;
      }

      const touchEndX = e.changedTouches[0].screenX;
      const touchEndY = e.changedTouches[0].screenY;

      const diffX = touchStartX - touchEndX;
      const diffY = touchStartY - touchEndY;

      const absX = Math.abs(diffX);
      const absY = Math.abs(diffY);

      const elapsed = Date.now() - touchStartTime;

      if (isPinching) {
        if (e.touches.length === 0) {
          isPinching = false;
          isTouching = false;
          blockClickTemporarily();
        }
        return;
      }

      /*
        확대된 상태에서는 스와이프로 페이지 넘김 금지.
        단, 거의 움직이지 않고 톡 누른 경우는 클릭으로 인정합니다.
      */
      if (isZoomedIn()) {
        const isTap = absX < 10 && absY < 10;

        if (!isTap) {
          blockClickTemporarily();
        }

        isTouching = false;
        return;
      }

      if (isClickBlocked()) {
        isTouching = false;
        return;
      }

      /*
        확대되지 않은 상태에서만 좌우 스와이프로 페이지 넘김
      */
      if (absX > 70 && absX > absY * 1.5 && elapsed < 900) {
        blockClickTemporarily();

        if (diffX > 0) {
          nextSlide();
        } else {
          prevSlide();
        }
      }

      isTouching = false;
    }, { passive: true });

    slideArea.addEventListener("touchcancel", function () {
      isTouching = false;
      isPinching = false;
      blockClickTemporarily();
    }, { passive: true });

    createThumbs();
    createDots();
    renderSlide();
  </script>
</body>
</html>
