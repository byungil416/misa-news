<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>정상어학원 이달의 소식지</title>
    
    <!-- Swiper 라이브러리 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <style>
        html, body {
            position: relative;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            font-family: sans-serif;
            overflow: hidden;
        }
        .swiper {
            width: 100%;
            height: 100%;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }
        .swiper-slide {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f2f5;
        }
        .swiper-zoom-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .swiper-zoom-container img {
            max-width: 95%;
            max-height: 90vh;
            object-fit: contain;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            background: #fff;
            border-radius: 4px;
        }
        .swiper-pagination-bullet-active {
            background: #1a73e8;
        }

        /* [수정] 투명 클릭 영역이 스와이프(드래그) 터치를 방해하지 않도록 개선 */
        .click-zones {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            pointer-events: none; /* 하위 요소인 슬라이더에 터치 이벤트를 통과시킴 */
        }
        .zone-left {
            width: 30%;
            height: 100%;
            cursor: pointer;
            pointer-events: auto; /* 클릭 영역만 선택적으로 터치 허용 */
        }
        .zone-right {
            width: 70%;
            height: 100%;
            cursor: pointer;
            pointer-events: auto; /* 클릭 영역만 선택적으로 터치 허용 */
        }
    </style>
</head>
<body>

<!-- 이미지 사전 로딩 -->
<div style="width:0; height:0; overflow:hidden; visibility:hidden; display:none;">
    <img src="page1.jpg"><img src="page2.jpg"><img src="page3.jpg"><img src="page4.jpg"><img src="page5.jpg">
    <img src="page6.jpg"><img src="page7.jpg"><img src="page8.jpg"><img src="page9.jpg"><img src="page10.jpg">
</div>

<!-- 소식지 본체 -->
<div class="swiper mySwiper">
    <!-- [구조 개선] 클릭 감지 영역 레이아웃 변경 -->
    <div class="click-zones">
        <div class="zone-left" onclick="swiper.slidePrev()"></div>
        <div class="zone-right" onclick="swiper.slideNext()"></div>
    </div>

    <div class="swiper-wrapper">
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page1.jpg" alt="1페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page2.jpg" alt="2페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page3.jpg" alt="3페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page4.jpg" alt="4페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page5.jpg" alt="5페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page6.jpg" alt="6페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page7.jpg" alt="7페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page8.jpg" alt="8페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page9.jpg" alt="9페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page10.jpg" alt="10페이지"></div></div>
    </div>
    
    <!-- 하단 페이지 도트 -->
    <div class="swiper-pagination"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    const swiper = new Swiper(".mySwiper", {
        effect: "slide", 
        touchStartPreventDefault: false, /* 모바일 스와이프 감도 개선 */
        zoom: {
            maxRatio: 3, 
            toggle: true, 
        },
        speed: 400, 
        grabCursor: true,
        keyboard: true,
        pagination: {
            el: ".swiper-pagination",
            clickable: true,
        },
    });
</script>

</body>
</html>
