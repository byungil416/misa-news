<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>정상어학원 이달의 소식지</title>
    <style>
body {
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* height를 min-height로 변경 */
            font-family: sans-serif;
            /* [수정] 모바일에서 두 손가락 확대가 가능하도록 잠금 해제 */
            overflow: auto; 
            -webkit-tap-highlight-color: transparent; 
        }
        .container {
            width: 100%;
            max-width: 900px;
            /* [수정] 확대 시 내용이 잘리지 않도록 유연하게 변경 */
            padding: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .flip-book {
            box-shadow: 0 12px 24px rgba(0,0,0,0.15);
            background-color: #fff;
        }
        .page {
            padding: 0;
            background-color: #fdfdfd;
            overflow: hidden;
        }
        .page-content {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }
        /* [중요] 확대 라이브러리가 높이를 0으로 만드는 버그를 방지하기 위해 강제 지정 */
        .pinch-zoom, .pinch-zoom-container {
            width: 100% !important;
            height: 100% !important;
        }
        .page-content img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            transform: translate3d(0, 0, 0);
            will-change: transform;
        }
    </style>
</head>
<body>

<!-- 이미지 사전 로딩 -->
<div style="width: 0; height: 0; overflow: hidden; visibility: hidden; display: none;">
    <img src="page1.jpg"><img src="page2.jpg"><img src="page3.jpg"><img src="page4.jpg"><img src="page5.jpg">
    <img src="page6.jpg"><img src="page7.jpg"><img src="page8.jpg"><img src="page9.jpg"><img src="page10.jpg">
</div>

<div class="container">
    <div class="flip-book" id="book">
        <div class="page"><div class="page-content"><div class="pinch-zoom"><img src="page1.jpg" alt="1페이지"></div></div></div>
        <div class="page"><div class="page-content"><div class="pinch-zoom"><img src="page2.jpg" alt="2페이지"></div></div></div>
        <div class="page"><div class="page-content"><div class="pinch-zoom"><img src="page3.jpg" alt="3페이지"></div></div></div>
        <div class="page"><div class="page-content"><div class="pinch-zoom"><img src="page4.jpg" alt="4페이지"></div></div></div>
        <div class="page"><div class="page-content"><div class="pinch-zoom"><img src="page5.jpg" alt="5페이지"></div></div></div>
        <div class="page"><div class="page-content"><div class="pinch-zoom"><img src="page6.jpg" alt="6페이지"></div></div></div>
        <div class="page"><div class="page-content"><div class="pinch-zoom"><img src="page7.jpg" alt="7페이지"></div></div></div>
        <div class="page"><div class="page-content"><div class="pinch-zoom"><img src="page8.jpg" alt="8페이지"></div></div></div>
        <div class="page"><div class="page-content"><div class="pinch-zoom"><img src="page9.jpg" alt="9페이지"></div></div></div>
        <div class="page"><div class="page-content"><div class="pinch-zoom"><img src="page10.jpg" alt="10페이지"></div></div></div>
    </div>
</div>

<!-- 플립북 및 호환성이 검증된 UMD 버전의 확대 라이브러리 로드 -->
<script src="https://cdn.jsdelivr.net/npm/page-flip@0.4.3/dist/js/page-flip.browser.min.js"></script>
<script src="https://unpkg.com/pinch-zoom-js@2.3.5/dist/pinch-zoom.umd.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        // 1. 플립북 기능 구동
        const pageFlip = new St.PageFlip(document.getElementById("book"), {
            width: 400, 
            height: 560,
            size: "stretch",
            minWidth: 300,
            maxWidth: 1000,
            minHeight: 420,
            maxHeight: 1350,
            maxShadowOpacity: 0.3,
            showCover: true,
            mobileScrollSupport: false
        });

        pageFlip.loadFromHTML(document.querySelectorAll(".page"));

        // 2. 오류가 수정된 방식으로 확대 기능 결합 (PinchZoom.default 호출)
        const elements = document.querySelectorAll('.pinch-zoom');
        elements.forEach(function(el) {
            new PinchZoom.default(el, {
                draggableUnzoomed: false, // 평소에는 드래그를 막아 페이지 넘김이 잘 되도록 설정
                minZoom: 1,
                maxZoom: 4 // 최대 4배 확대
            });
        });
    });
</script>

</body>
</html>
