<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>정상어학원 이달의 소식지</title>
    
    <!-- Swiper 라이브러리 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <style>
        html, body {
            position: relative;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            font-family: sans-serif;
            overflow: hidden;
        }
        .swiper {
            width: 100%;
            height: 100%;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }
        .swiper-slide {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f2f5;
        }
        .swiper-zoom-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .swiper-zoom-container img {
            max-width: 95%;
            max-height: 90vh;
            object-fit: contain;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            background: #fff;
            border-radius: 4px;
        }
        .swiper-pagination-bullet-active {
            background: #1a73e8;
        }

        /* [추가] 눈에 보이지 않는 좌우 터치 영역 설계 (글씨를 절대 가리지 않음) */
        .click-zone-left {
            position: absolute;
            left: 0;
            top: 0;
            width: 30%; /* 화면 왼쪽 30% 영역 */
            height: 100%;
            z-index: 10; /* 소식지 이미지보다 위에 배치 */
            cursor: pointer;
        }
        .click-zone-right {
            position: absolute;
            right: 0;
            top: 0;
            width: 70%; /* 화면 오른쪽 70% 영역 (보통 오른손으로 많이 누르므로 더 넓게 설정) */
            height: 100%;
            z-index: 10;
            cursor: pointer;
        }
    </style>
</head>
<body>

<!-- 이미지 사전 로딩 -->
<div style="width:0; height:0; overflow:hidden; visibility:hidden; display:none;">
    <img src="page1.jpg"><img src="page2.jpg"><img src="page3.jpg"><img src="page4.jpg"><img src="page5.jpg">
    <img src="page6.jpg"><img src="page7.jpg"><img src="page8.jpg"><img src="page9.jpg"><img src="page10.jpg">
</div>

<!-- 소식지 본체 -->
<div class="swiper mySwiper">
    <!-- [변경] 양옆 화살표 HTML 태그를 삭제하고 투명한 클릭 감지 구역 배치 -->
    <div class="click-zone-left" onclick="swiper.slidePrev()"></div>
    <div class="click-zone-right" onclick="swiper.slideNext()"></div>

    <div class="swiper-wrapper">
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page1.jpg" alt="1페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page2.jpg" alt="2페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page3.jpg" alt="3페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page4.jpg" alt="4페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page5.jpg" alt="5페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page6.jpg" alt="6페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page7.jpg" alt="7페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page8.jpg" alt="8페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page9.jpg" alt="9페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page10.jpg" alt="10페이지"></div></div>
    </div>
    
    <!-- 하단 페이지 도트 (현재 위치를 알기 위해 남겨둠) -->
    <div class="swiper-pagination"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    // 클릭 이벤트를 자바스크립트에서 제어하기 위해 const swiper 변수로 전역 선언
    const swiper = new Swiper(".mySwiper", {
        effect: "slide", 
        zoom: {
            maxRatio: 3, 
            toggle: true, 
        },
        speed: 400, 
        grabCursor: true,
        keyboard: true,
        pagination: {
            el: ".swiper-pagination",
            clickable: true,
        },
    });
</script>

</body>
</html>
