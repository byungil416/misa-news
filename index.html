<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <!-- 모바일 화면맞춤 기준 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

  <title>Newsletter Slide Viewer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #222;
      color: #fff;
      overflow: hidden;
    }

    .viewer {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle, #444 0%, #1c1c1c 70%);
    }

    .topbar {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: rgba(0, 0, 0, 0.55);
      z-index: 10;
      flex-shrink: 0;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
    }

    .buttons {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button {
      border: 0;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .slide-area {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;

      /*
        중요:
        모바일 브라우저 기본 확대/스크롤을 막고,
        JS로 직접 확대/이동을 처리합니다.
      */
      touch-action: none;
    }

    .slide-box {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.18s ease;
      transform-origin: center center;
      will-change: transform;
    }

    .slide-img {
      max-width: 92vw;
      max-height: calc(100vh - 116px);
      object-fit: contain;
      background: #fff;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.55);
      border-radius: 8px;
      transition: opacity 0.25s ease, transform 0.25s ease;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .slide-img.fade {
      opacity: 0;
      transform: scale(0.98);
    }

    .nav-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 25%;
      cursor: pointer;
      z-index: 5;
    }

    .nav-left {
      left: 0;
    }

    .nav-right {
      right: 0;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 64px;
      opacity: 0;
      transition: opacity 0.2s ease;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
      pointer-events: none;
    }

    .nav-left .arrow {
      left: 28px;
    }

    .nav-right .arrow {
      right: 28px;
    }

    .nav-zone:hover .arrow {
      opacity: 0.75;
    }

    .bottom-dots-bar {
      min-height: 54px;
      height: auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 10px 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
      background: rgba(0, 0, 0, 0.55);
      z-index: 10;
      flex-shrink: 0;
    }

    .dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      max-width: 90vw;
      padding-top: 2px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
      flex: 0 0 auto;
    }

    .dot.active {
      background: #fff;
      transform: scale(1.35);
    }

    .dot:hover {
      background: rgba(255, 255, 255, 0.75);
    }

    .thumbs {
      position: absolute;
      left: 50%;
      bottom: 68px;
      transform: translateX(-50%);
      width: min(92vw, 900px);
      display: none;
      gap: 8px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 14px;
      overflow-x: auto;
      z-index: 20;
    }

    .thumbs.show {
      display: flex;
    }

    .thumb {
      width: 70px;
      height: 95px;
      flex: 0 0 auto;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      background: #fff;
    }

    .thumb.active {
      border-color: #fff;
      transform: translateY(-3px);
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @media (max-width: 700px) {
      .topbar {
        height: 52px;
        padding: 0 10px;
      }

      .title {
        font-size: 13px;
      }

      button {
        padding: 7px 9px;
        font-size: 12px;
      }

      .slide-img {
        max-width: 94vw;
        max-height: calc(100vh - 116px);
      }

      .bottom-dots-bar {
        min-height: 58px;
        padding-top: 8px;
        padding-bottom: calc(18px + env(safe-area-inset-bottom));
        align-items: flex-start;
      }

      .dots {
        gap: 7px;
        max-width: 88vw;
        padding-top: 0;
      }

      .dot {
        width: 8px;
        height: 8px;
      }

      .arrow {
        font-size: 46px;
      }

      .thumbs {
        bottom: 72px;
      }
    }

    @media (max-width: 430px) {
      .bottom-dots-bar {
        min-height: 60px;
        padding-top: 8px;
        padding-bottom: calc(20px + env(safe-area-inset-bottom));
      }

      .dots {
        gap: 6px;
        max-width: 86vw;
      }

      .dot {
        width: 7px;
        height: 7px;
      }

      .slide-img {
        max-height: calc(100vh - 120px);
      }

      .thumbs {
        bottom: 74px;
      }
    }
  </style>
</head>

<body>
  <div class="viewer">
    <div class="topbar">
      <div class="title">Newsletter</div>

      <div class="buttons">
        <button onclick="toggleThumbs()">목록</button>
        <button onclick="zoomOut()">－</button>
        <button onclick="zoomIn()">＋</button>
        <button onclick="resetZoom()">화면맞춤</button>
        <button onclick="toggleFullscreen()">전체화면</button>
      </div>
    </div>

    <div class="slide-area" id="slideArea">
      <div class="nav-zone nav-left" onclick="safePrevSlide(event)">
        <div class="arrow">‹</div>
      </div>

      <div class="slide-box" id="slideBox">
        <img id="slideImg" class="slide-img" src="page1.jpg" alt="newsletter page">
      </div>

      <div class="nav-zone nav-right" onclick="safeNextSlide(event)">
        <div class="arrow">›</div>
      </div>

      <div class="thumbs" id="thumbs"></div>
    </div>

    <div class="bottom-dots-bar">
      <div class="dots" id="dots"></div>
    </div>
  </div>

  <script>
    /*
      추후 페이지 수를 바꿀 때는 여기만 수정하세요.
      예: 10페이지면 10, 18페이지면 18
    */
    const totalPages = 10;

    /*
      이미지 확장자도 여기에서 수정하세요.
      page1.jpg, page2.jpg 형식이면 "jpg"
      page1.png, page2.png 형식이면 "png"
    */
    const imageExtension = "jpg";

    let currentPage = 1;

    /*
      zoom = 1 이 화면맞춤 상태입니다.
      모바일에서도 처음에는 항상 화면맞춤으로 보입니다.
    */
    let zoom = 1;
    let panX = 0;
    let panY = 0;

    const minZoom = 1;
    const maxZoom = 3;

    const slideArea = document.getElementById("slideArea");
    const slideImg = document.getElementById("slideImg");
    const slideBox = document.getElementById("slideBox");
    const thumbs = document.getElementById("thumbs");
    const dots = document.getElementById("dots");

    function imagePath(pageNumber) {
      return `page${pageNumber}.${imageExtension}`;
    }

    function renderSlide() {
      slideImg.classList.add("fade");

      setTimeout(() => {
        slideImg.src = imagePath(currentPage);

        /*
          페이지가 바뀌면 다시 화면맞춤으로 초기화
        */
        resetZoom();

        updateActiveThumb();
        updateActiveDot();

        slideImg.classList.remove("fade");
      }, 150);
    }

    function nextSlide() {
      if (currentPage < totalPages) {
        currentPage++;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentPage > 1) {
        currentPage--;
        renderSlide();
      }
    }

    function goToPage(pageNumber) {
      if (pageNumber < 1 || pageNumber > totalPages) return;

      currentPage = pageNumber;
      renderSlide();
    }

    function isZoomedIn() {
      return zoom > 1.01;
    }

    function applyTransform() {
      slideBox.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
    }

    function resetZoom() {
      zoom = 1;
      panX = 0;
      panY = 0;
      applyTransform();
    }

    function zoomIn() {
      zoom = Math.min(zoom + 0.2, maxZoom);
      applyTransform();
    }

    function zoomOut() {
      zoom = Math.max(zoom - 0.2, minZoom);

      if (zoom === 1) {
        panX = 0;
        panY = 0;
      }

      applyTransform();
    }

    let blockClickUntil = 0;

    function isClickBlocked() {
      return Date.now() < blockClickUntil;
    }

    function blockClickTemporarily() {
      blockClickUntil = Date.now() + 450;
    }

    function safeNextSlide(e) {
      if (isClickBlocked()) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        return;
      }

      nextSlide();
    }

    function safePrevSlide(e) {
      if (isClickBlocked()) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        return;
      }

      prevSlide();
    }

    document.addEventListener("click", function (e) {
      if (isClickBlocked()) {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
      }
    }, true);

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    function toggleThumbs() {
      thumbs.classList.toggle("show");
    }

    function createThumbs() {
      thumbs.innerHTML = "";

      for (let i = 1; i <= totalPages; i++) {
        const thumb = document.createElement("div");
        thumb.className = "thumb";
        thumb.dataset.page = i;

        const img = document.createElement("img");
        img.src = imagePath(i);
        img.alt = `page ${i}`;

        thumb.appendChild(img);

        thumb.addEventListener("click", () => {
          if (isClickBlocked()) return;

          goToPage(i);
          thumbs.classList.remove("show");
        });

        thumbs.appendChild(thumb);
      }
    }

    function updateActiveThumb() {
      document.querySelectorAll(".thumb").forEach(thumb => {
        const page = Number(thumb.dataset.page);
        thumb.classList.toggle("active", page === currentPage);
      });
    }

    function createDots() {
      dots.innerHTML = "";

      for (let i = 1; i <= totalPages; i++) {
        const dot = document.createElement("div");
        dot.className = "dot";
        dot.dataset.page = i;
        dot.title = `${i}페이지`;

        dot.addEventListener("click", () => {
          if (isClickBlocked()) return;

          goToPage(i);
        });

        dots.appendChild(dot);
      }
    }

    function updateActiveDot() {
      document.querySelectorAll(".dot").forEach(dot => {
        const page = Number(dot.dataset.page);
        dot.classList.toggle("active", page === currentPage);
      });
    }

    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight") nextSlide();
      if (e.key === "ArrowLeft") prevSlide();
      if (e.key === "+") zoomIn();
      if (e.key === "-") zoomOut();
      if (e.key === "0") resetZoom();
      if (e.key === "Escape") thumbs.classList.remove("show");
    });

    /*
      모바일 터치 처리

      - 두 손가락 벌리기/오므리기: 내부 확대/축소
      - 확대 상태에서 한 손가락 이동: 이미지 이동
      - 확대 안 된 상태에서 좌우 스와이프: 페이지 넘김
      - 확대 상태에서 좌우 영역 톡 클릭: 페이지 넘김
    */

    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;

    let lastPanX = 0;
    let lastPanY = 0;

    let isTouching = false;
    let isPinching = false;
    let startPinchDistance = 0;
    let startZoom = 1;

    function getDistance(touch1, touch2) {
      const dx = touch1.clientX - touch2.clientX;
      const dy = touch1.clientY - touch2.clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    slideArea.addEventListener("touchstart", function (e) {
      e.preventDefault();

      isTouching = true;

      if (e.touches.length >= 2) {
        isPinching = true;
        startPinchDistance = getDistance(e.touches[0], e.touches[1]);
        startZoom = zoom;
        blockClickTemporarily();
        return;
      }

      isPinching = false;

      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchStartTime = Date.now();

      lastPanX = panX;
      lastPanY = panY;
    }, { passive: false });

    slideArea.addEventListener("touchmove", function (e) {
      e.preventDefault();

      /*
        두 손가락 확대/축소
      */
      if (e.touches.length >= 2) {
        isPinching = true;

        const currentDistance = getDistance(e.touches[0], e.touches[1]);
        const scale = currentDistance / startPinchDistance;

        zoom = Math.min(Math.max(startZoom * scale, minZoom), maxZoom);

        if (zoom === 1) {
          panX = 0;
          panY = 0;
        }

        applyTransform();
        blockClickTemporarily();
        return;
      }

      /*
        확대된 상태에서 한 손가락 이동
      */
      if (isZoomedIn() && e.touches.length === 1) {
        const currentX = e.touches[0].clientX;
        const currentY = e.touches[0].clientY;

        const moveX = currentX - touchStartX;
        const moveY = currentY - touchStartY;

        panX = lastPanX + moveX;
        panY = lastPanY + moveY;

        applyTransform();
        blockClickTemporarily();
      }
    }, { passive: false });

    slideArea.addEventListener("touchend", function (e) {
      if (!isTouching) return;

      if (isPinching) {
        if (e.touches.length === 0) {
          isPinching = false;
          isTouching = false;
          blockClickTemporarily();
        }
        return;
      }

      if (!e.changedTouches || e.changedTouches.length === 0) {
        isTouching = false;
        return;
      }

      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;

      const diffX = touchStartX - touchEndX;
      const diffY = touchStartY - touchEndY;

      const absX = Math.abs(diffX);
      const absY = Math.abs(diffY);
      const elapsed = Date.now() - touchStartTime;

      /*
        확대 상태에서는 스와이프로 페이지 넘김 금지.
        단, 거의 움직이지 않은 톡 터치는 클릭으로 인정합니다.
      */
      if (isZoomedIn()) {
        const isTap = absX < 10 && absY < 10;

        if (!isTap) {
          blockClickTemporarily();
        }

        isTouching = false;
        return;
      }

      if (isClickBlocked()) {
        isTouching = false;
        return;
      }

      /*
        화면맞춤 상태에서만 좌우 스와이프로 페이지 넘김
      */
      if (absX > 70 && absX > absY * 1.5 && elapsed < 900) {
        blockClickTemporarily();

        if (diffX > 0) {
          nextSlide();
        } else {
          prevSlide();
        }
      }

      isTouching = false;
    }, { passive: false });

    slideArea.addEventListener("touchcancel", function () {
      isTouching = false;
      isPinching = false;
      blockClickTemporarily();
    }, { passive: false });

    createThumbs();
    createDots();
    renderSlide();
  </script>
</body>
</html>
