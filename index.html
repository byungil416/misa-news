<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정상어학원 이달의 소식지</title>
    <style>
        body {
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 900px;
            height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .flip-book {
            box-shadow: 0 12px 24px rgba(0,0,0,0.15);
            background-color: #fff;
        }
        .page {
            padding: 0;
            background-color: #fdfdfd;
            overflow: hidden;
        }
        .page-content {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .page-content img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 이미지가 잘리지 않고 가득 차게 설정 */
        }
    </style>
</head>
<body>

<div class="container">
    <div class="flip-book" id="book">
        <div class="page"><div class="page-content"><img src="page1.jpg" alt="1페이지"></div></div>
        <div class="page"><div class="page-content"><img src="page2.jpg" alt="2페이지"></div></div>
        <div class="page"><div class="page-content"><img src="page3.jpg" alt="3페이지"></div></div>
        <div class="page"><div class="page-content"><img src="page4.jpg" alt="4페이지"></div></div>
        <div class="page"><div class="page-content"><img src="page5.jpg" alt="5페이지"></div></div>
        <div class="page"><div class="page-content"><img src="page6.jpg" alt="6페이지"></div></div>
        <div class="page"><div class="page-content"><img src="page7.jpg" alt="7페이지"></div></div>
        <div class="page"><div class="page-content"><img src="page8.jpg" alt="8페이지"></div></div>
        <div class="page"><div class="page-content"><img src="page9.jpg" alt="9페이지"></div></div>
        <div class="page"><div class="page-content"><img src="page10.jpg" alt="10페이지"></div></div>
    
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@0.4.3/dist/js/page-flip.browser.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        // 이미지가 세로형(A4 등)인지 가로형인지에 따라 가로/세로 비율(width, height)을 조절해 주세요.
        // 예: 일반적인 A4 한 면 기준 가로 400, 세로 560 정도가 적당합니다.
        const pageFlip = new St.PageFlip(document.getElementById("book"), {
            width: 400, 
            height: 560,
            size: "stretch", // 화면 크기에 맞게 자동으로 늘어나거나 줄어듦
            minWidth: 300,
            maxWidth: 1000,
            minHeight: 420,
            maxHeight: 1350,
            maxShadowOpacity: 0.5, // 책 넘길 때 그림자 선명도
            showCover: true, // 첫 페이지(표지)를 한 장짜리 책 표지처럼 보이게 함
            mobileScrollSupport: false
        });

        // 작성한 HTML 구조를 기반으로 플립북 초기화 구동
        pageFlip.loadFromHTML(document.querySelectorAll(".page"));
    });
</script>

</body>
</html>
