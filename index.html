<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>정상어학원 이달의 소식지</title>
    
    <!-- Swiper 라이브러리 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <style>
        html, body {
            position: relative;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            font-family: sans-serif;
            overflow: hidden;
        }
        .swiper {
            width: 100%;
            height: 100%;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }
        .swiper-slide {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f2f5;
        }
        .swiper-zoom-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .swiper-zoom-container img {
            max-width: 95%;
            max-height: 90vh;
            object-fit: contain;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            background: #fff;
            border-radius: 4px;
        }
        .swiper-pagination-bullet-active {
            background: #1a73e8;
        }
    </style>
</head>
<body>

<!-- 이미지 사전 로딩 -->
<div style="width:0; height:0; overflow:hidden; visibility:hidden; display:none;">
    <img src="page1.jpg"><img src="page2.jpg"><img src="page3.jpg"><img src="page4.jpg"><img src="page5.jpg">
    <img src="page6.jpg"><img src="page7.jpg"><img src="page8.jpg"><img src="page9.jpg"><img src="page10.jpg">
</div>

<!-- 소식지 본체 (방해하던 투명 click-zone 태그들을 완전히 삭제했습니다) -->
<div class="swiper mySwiper">
    <div class="swiper-wrapper">
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page1.jpg" alt="1페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page2.jpg" alt="2페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page3.jpg" alt="3페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page4.jpg" alt="4페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page5.jpg" alt="5페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page6.jpg" alt="6페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page7.jpg" alt="7페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page8.jpg" alt="8페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page9.jpg" alt="9페이지"></div></div>
        <div class="swiper-slide"><div class="swiper-zoom-container"><img src="page10.jpg" alt="10페이지"></div></div>
    </div>
    
    <!-- 하단 페이지 도트 -->
    <div class="swiper-pagination"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    const swiper = new Swiper(".mySwiper", {
        effect: "slide", 
        zoom: {
            maxRatio: 3, 
            toggle: true, // 더블 클릭/터치 시 확대 유지
        },
        speed: 400, 
        grabCursor: true,
        keyboard: true,
        pagination: {
            el: ".swiper-pagination",
            clickable: true,
        },
        
        // [핵심 변경] 투명 막 대신, 슬라이더 자체의 클릭 이벤트를 감지하여 좌우 이동 처리
        on: {
            click: function (e) {
                // 이미지가 확대된 상태(배율이 1보다 클 때)에는 클릭 이동을 작동시키지 않음 (확대 상태 이동 방해 금지)
                if (this.zoom && this.zoom.scale > 1) return;

                const windowWidth = window.innerWidth;
                const clickX = e.clientX; // 사용자가 클릭한 가로 좌표

                // 화면의 왼쪽 30% 영역을 클릭하면 이전 페이지로
                if (clickX < windowWidth * 0.3) {
                    this.slidePrev();
                } 
                // 그 외 영역(오른쪽 70%)을 클릭하면 다음 페이지로
                else {
                    this.slideNext();
                }
            }
        }
    });
</script>

</body>
</html>
