<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <!-- 모바일 확대 허용 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Newsletter Slide Viewer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #222;
      color: #fff;
      overflow: hidden;
    }

    .viewer {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle, #444 0%, #1c1c1c 70%);
    }

    .topbar {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: rgba(0, 0, 0, 0.55);
      z-index: 10;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
    }

    .buttons {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button {
      border: 0;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .slide-area {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;

      /*
        중요:
        브라우저 기본 확대/축소는 허용하되,
        JS에서 두 손가락 동작과 클릭 오작동을 따로 막습니다.
      */
      touch-action: manipulation;
    }

    .slide-box {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s ease;
    }

    .slide-img {
      max-width: 92vw;
      max-height: calc(100vh - 145px);
      object-fit: contain;
      background: #fff;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.55);
      border-radius: 8px;
      transition: opacity 0.25s ease, transform 0.25s ease;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    .slide-img.fade {
      opacity: 0;
      transform: scale(0.98);
    }

    .nav-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 25%;
      cursor: pointer;
      z-index: 5;
    }

    .nav-left {
      left: 0;
    }

    .nav-right {
      right: 0;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 64px;
      opacity: 0;
      transition: opacity 0.2s ease;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
      pointer-events: none;
    }

    .nav-left .arrow {
      left: 28px;
    }

    .nav-right .arrow {
      right: 28px;
    }

    .nav-zone:hover .arrow {
      opacity: 0.75;
    }

    .bottom-bar {
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.55);
      z-index: 10;
    }

    .page-info {
      min-width: 90px;
      text-align: center;
      font-size: 14px;
    }

    input[type="range"] {
      width: min(50vw, 520px);
      accent-color: white;
    }

    .thumbs {
      position: absolute;
      left: 50%;
      bottom: 100px;
      transform: translateX(-50%);
      width: min(92vw, 900px);
      display: none;
      gap: 8px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 14px;
      overflow-x: auto;
      z-index: 20;
    }

    .thumbs.show {
      display: flex;
    }

    .thumb {
      width: 70px;
      height: 95px;
      flex: 0 0 auto;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      background: #fff;
    }

    .thumb.active {
      border-color: #fff;
      transform: translateY(-3px);
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @media (max-width: 700px) {
      .topbar {
        height: 52px;
        padding: 0 10px;
      }

      .title {
        font-size: 13px;
      }

      button {
        padding: 7px 9px;
        font-size: 12px;
      }

      .bottom-bar {
        height: 76px;
        gap: 8px;
        padding: 10px;
      }

      input[type="range"] {
        width: 38vw;
      }

      .page-info {
        min-width: 70px;
        font-size: 13px;
      }

      .slide-img {
        max-width: 94vw;
        max-height: calc(100vh - 130px);
      }

      .arrow {
        font-size: 46px;
      }
    }
  </style>
</head>

<body>
  <div class="viewer">
    <div class="topbar">
      <div class="title">Newsletter</div>

      <div class="buttons">
        <button onclick="toggleThumbs()">목록</button>
        <button onclick="zoomOut()">－</button>
        <button onclick="zoomIn()">＋</button>
        <button onclick="toggleFullscreen()">전체화면</button>
      </div>
    </div>

    <div class="slide-area" id="slideArea">
      <!-- onclick을 직접 prevSlide()로 연결하지 않고 safePrevSlide()로 연결 -->
      <div class="nav-zone nav-left" onclick="safePrevSlide(event)">
        <div class="arrow">‹</div>
      </div>

      <div class="slide-box" id="slideBox">
        <img id="slideImg" class="slide-img" src="page1.jpg" alt="newsletter page">
      </div>

      <!-- onclick을 직접 nextSlide()로 연결하지 않고 safeNextSlide()로 연결 -->
      <div class="nav-zone nav-right" onclick="safeNextSlide(event)">
        <div class="arrow">›</div>
      </div>

      <div class="thumbs" id="thumbs"></div>
    </div>

    <div class="bottom-bar">
      <button id="prevBtn" onclick="prevSlide()">이전</button>
      <input type="range" id="pageSlider" min="1" max="10" value="1">
      <div class="page-info" id="pageInfo">1 / 10</div>
      <button id="nextBtn" onclick="nextSlide()">다음</button>
    </div>
  </div>

  <script>
    const totalPages = 10;

    // 이미지가 png라면 "jpg"를 "png"로 바꾸세요.
    const imageExtension = "jpg";

    let currentPage = 1;
    let zoom = 1;

    const slideArea = document.getElementById("slideArea");
    const slideImg = document.getElementById("slideImg");
    const slideBox = document.getElementById("slideBox");
    const pageInfo = document.getElementById("pageInfo");
    const slider = document.getElementById("pageSlider");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const thumbs = document.getElementById("thumbs");

    function imagePath(pageNumber) {
      return `page${pageNumber}.${imageExtension}`;
    }

    function renderSlide() {
      slideImg.classList.add("fade");

      setTimeout(() => {
        slideImg.src = imagePath(currentPage);
        pageInfo.textContent = `${currentPage} / ${totalPages}`;
        slider.value = currentPage;

        prevBtn.disabled = currentPage === 1;
        nextBtn.disabled = currentPage === totalPages;

        updateActiveThumb();
        slideImg.classList.remove("fade");
      }, 150);
    }

    function nextSlide() {
      if (currentPage < totalPages) {
        currentPage++;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentPage > 1) {
        currentPage--;
        renderSlide();
      }
    }

    /*
      중요:
      모바일 pinch 후 click 이벤트가 늦게 발생하는 경우를 막기 위한 안전 함수
    */

    let blockClickUntil = 0;

    function isClickBlocked() {
      return Date.now() < blockClickUntil;
    }

    function blockClickTemporarily() {
      blockClickUntil = Date.now() + 500;
    }

    function safeNextSlide(e) {
      if (isClickBlocked()) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        return;
      }

      nextSlide();
    }

    function safePrevSlide(e) {
      if (isClickBlocked()) {
        if (e) {
          e.preventDefault();
          e.stopPropagation();
        }
        return;
      }

      prevSlide();
    }

    /*
      캡처 단계에서 click 자체를 차단
      pinch 후 nav-zone onclick이 실행되는 문제 방지
    */

    document.addEventListener("click", function (e) {
      if (isClickBlocked()) {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
      }
    }, true);

    slider.addEventListener("input", function () {
      currentPage = Number(this.value);
      renderSlide();
    });

    function zoomIn() {
      zoom = Math.min(zoom + 0.15, 2);
      applyZoom();
    }

    function zoomOut() {
      zoom = Math.max(zoom - 0.15, 0.7);
      applyZoom();
    }

    function applyZoom() {
      slideBox.style.transform = `scale(${zoom})`;
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    function toggleThumbs() {
      thumbs.classList.toggle("show");
    }

    function createThumbs() {
      thumbs.innerHTML = "";

      for (let i = 1; i <= totalPages; i++) {
        const thumb = document.createElement("div");
        thumb.className = "thumb";
        thumb.dataset.page = i;

        const img = document.createElement("img");
        img.src = imagePath(i);
        img.alt = `page ${i}`;

        thumb.appendChild(img);

        thumb.addEventListener("click", () => {
          if (isClickBlocked()) return;

          currentPage = i;
          renderSlide();
          thumbs.classList.remove("show");
        });

        thumbs.appendChild(thumb);
      }
    }

    function updateActiveThumb() {
      document.querySelectorAll(".thumb").forEach(thumb => {
        const page = Number(thumb.dataset.page);
        thumb.classList.toggle("active", page === currentPage);
      });
    }

    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight") nextSlide();
      if (e.key === "ArrowLeft") prevSlide();
      if (e.key === "+") zoomIn();
      if (e.key === "-") zoomOut();
      if (e.key === "Escape") thumbs.classList.remove("show");
    });

    /*
      모바일 터치 처리
      - 한 손가락 좌우 스와이프: 페이지 넘김
      - 두 손가락 확대/축소: 페이지 넘김 차단
      - pinch 후 발생하는 click 이벤트도 차단
    */

    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;

    let isTouching = false;
    let isPinching = false;
    let hasMoved = false;

    slideArea.addEventListener("touchstart", function (e) {
      isTouching = true;
      hasMoved = false;

      if (e.touches.length >= 2) {
        isPinching = true;
        blockClickTemporarily();
        return;
      }

      isPinching = false;
      touchStartX = e.touches[0].screenX;
      touchStartY = e.touches[0].screenY;
      touchStartTime = Date.now();
    }, { passive: true });

    slideArea.addEventListener("touchmove", function (e) {
      hasMoved = true;

      if (e.touches.length >= 2) {
        isPinching = true;
        blockClickTemporarily();
        return;
      }
    }, { passive: true });

    slideArea.addEventListener("touchend", function (e) {
      if (!isTouching) return;

      /*
        두 손가락 확대/축소 중이었으면
        페이지 넘김도 막고,
        뒤이어 발생하는 click도 막음
      */
      if (isPinching) {
        if (e.touches.length === 0) {
          isPinching = false;
          isTouching = false;
          blockClickTemporarily();
        }
        return;
      }

      if (isClickBlocked()) {
        isTouching = false;
        return;
      }

      if (!e.changedTouches || e.changedTouches.length === 0) {
        isTouching = false;
        return;
      }

      const touchEndX = e.changedTouches[0].screenX;
      const touchEndY = e.changedTouches[0].screenY;

      const diffX = touchStartX - touchEndX;
      const diffY = touchStartY - touchEndY;

      const absX = Math.abs(diffX);
      const absY = Math.abs(diffY);

      const elapsed = Date.now() - touchStartTime;

      /*
        조건을 모두 만족할 때만 페이지 넘김
        1. 가로 이동이 충분히 큼
        2. 세로 이동보다 가로 이동이 훨씬 큼
        3. 너무 느린 드래그가 아님
      */
      if (absX > 70 && absX > absY * 1.5 && elapsed < 900) {
        blockClickTemporarily();

        if (diffX > 0) {
          nextSlide();
        } else {
          prevSlide();
        }
      }

      isTouching = false;
    }, { passive: true });

    slideArea.addEventListener("touchcancel", function () {
      isTouching = false;
      isPinching = false;
      blockClickTemporarily();
    }, { passive: true });

    createThumbs();
    renderSlide();
  </script>
</body>
</html>
